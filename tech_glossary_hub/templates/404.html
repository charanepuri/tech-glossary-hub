{% extends "glossary/base.html" %}

{% block title %}
404 | Page Not Found
{% endblock %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="text-center py-5">

            <i class="bi bi-exclamation-triangle display-1 text-warning"></i>

            <h1 class="display-4 fw-bold mt-4">
                404
            </h1>

            <h3 class="mb-3">
                Page Not Found
            </h3>

            <p class="text-muted mb-4">
                The page you are looking for doesn't exist or may have been moved.
            </p>

            <a href="{% url 'home' %}" class="btn btn-primary me-2">
                Home
            </a>

            <a href="{% url 'glossary_list' %}" class="btn btn-outline-primary">
                Browse Glossary
            </a>

        </div>

    </div>

</section>

{% endblock %}
